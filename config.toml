# Configuration for the Remonce local server

[oidc]
# The base URL of the OIDC provider (Vault)
# This should match the 'issuer' URL from the Terraform outputs.
issuer_url = "http://127.0.0.1:8200/v1/identity/oidc/provider/vaultprovider"

# The *signing* OIDC client. Every approval, cosign and revocation is a
# fresh login to this client with forced re-authentication.
# This should match the 'oidc_client_id' from the Terraform outputs.
client_id = "k6zGO8u0k6MMwkqTNbLCkGeFx2QWT8iW"

# The *viewer* OIDC client, used to log in for browsing files and logs. Its
# tokens are bearer credentials the agent accepts only on read-only
# endpoints. Must differ from client_id. Required by `remonce web`.
# This should match the 'oidc_viewer_client_id' from the Terraform outputs.
viewer_client_id = "xtoIjxJ0LDciBOD3TKqd175ZVKTne6er"

# Re-authentication on signing logins. max_age defaults to 1s, i.e. always
# re-authenticate (Vault rejects 0). Add prompt=login for IdPs that ignore
# max_age.
#signing_max_age = "1s"
#signing_prompt_login = false

# Explicit redirect URI to avoid cookie domain mismatch (localhost vs 127.0.0.1)
redirect_uri = "http://localhost:8080/oidc/callback"

# Agent the web UI proxies execution/files/log-streams to. Must be https://.
# Default: "https://localhost:10022". For self-signed agent certs, point
# agent_ca_path at the cert/CA PEM (additive to system roots).
#agent_url = "https://localhost:10022"
#agent_ca_path = "certs/agent-cert.pem"

# Default TSA is DigiCert's free public service and the bundled DigiCert G4
# root is always trusted. Uncomment only if you need to point at a different
# TSA or add private roots. See CONFIGURATION.md.
#[timestamp_authority]
#url = "http://timestamp.digicert.com"
#ca_path = "./tsa_chain.pem"
#trust_system_store = false   # set true only with `--insecure`

[[commands]]
name = "test"
description = "A basic test command to verify connectivity."
opa_rule = "data.remonce.authz.decision"
approver_max_validity = "1d" # Optional: override the default 3-day approver validity (e.g. 1h, 30m)

[[commands]]
name = "fail"
description = "A command designed to fail for testing error handling."
opa_rule = "data.remonce.authz.decision"

[[commands]]
name = "ping-test"
description = "Pings localhost a configurable number of times to test execution streaming."
opa_rule = "data.remonce.authz.decision"
executable = "ping"
# {{count}} is substituted from the signed `params` after validation.
args = ["-n", "{{count}}", "127.0.0.1"]

# Declared parameters. Validation is fail-closed: a param with no `allowed`,
# `pattern`, or `min`/`max` rule gets a conservative default pattern
# (alphanumeric-ish, max 64 chars, no leading dash — prevents flag injection).
[[commands.params]]
name = "count"
description = "Number of pings"
default = "10"
min = 1
max = 100

[[files]]
path = "logs/*.log"
name = "execution-logs"
description = "Access to execution logs"

[[files]]
path = "config.toml"
description = "Server configuration file"

# Agent configuration — required when running `remonce agent`.
# TLS is mandatory; use `mode = "files"` with a self-signed cert for local dev,
# or `mode = "acme"` with a public DNS name in production.
#
# [agent]
# listen_address = "0.0.0.0:10022"
# cors_allowed_origins = []  # empty = no CORS layer
#
# Optional central revocation service. FAIL-CLOSED: when set, the agent
# checks it before every execution and denies if it is unreachable.
# revocation_service_url = "https://revocations.example.com:10023"
# revocation_service_ca_path = "certs/revocation-cert.pem"
#
# [agent.tls]
# mode = "files"
# chain = "certs/agent-cert.pem"
# key = "certs/agent-key.pem"
#
# Or for ACME:
# [agent.tls]
# mode = "acme"
# domains = ["agent.example.com"]
# email = ["ops@example.com"]
# cache_dir = "certs/acme-cache"
# # directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"

# Central revocation service — required when running `remonce revocation-service`.
# Persists revocations to a JSONL file so they survive restarts and apply
# estate-wide from a single submission.
#
# [revocation_service]
# listen_address = "0.0.0.0:10023"
# persist_path = "revocations.jsonl"
#
# [revocation_service.tls]
# mode = "files"
# chain = "certs/revocation-cert.pem"
# key = "certs/revocation-key.pem"
