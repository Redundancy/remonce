[package]
name = "remonce"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
base64 = "0.22"
x509-parser = "0.18.0"


# Web server framework
axum = { version = "0.8.7", features = ["ws"] }
hyper-util = { version = "0.1", features = ["full"] }
axum-extra = { version = "0.12.2", features = ["cookie"] }
tower-http = { version = "0.6.8", features = ["cors", "fs", "trace"] }
tower-sessions = "0.14.0"

# TLS and File Watching
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["compat"] }
rustls-pemfile = "2.1"
rustls-acme = { version = "0.14.1", default-features = false, features = ["axum", "ring", "tokio"] }
notify = "8.2.0"
futures = "0.3"

# OIDC and Crypto
url = "2.5"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa-core", "pem"] }
rsa = { version = "0.9", features = ["sha2"] }
spki = "0.7"
jsonwebtoken = { version = "10.2.0", default-features = false, features = ["use_pem", "rust_crypto"] }
rand = "0.8.5"
hex = "0.4"
toml = "0.9.8"

tracing-subscriber = { version = "0.3.22", features = ["json"] }
hostname = "0.4"
tracing = "0.1.41"
thiserror = "2.0.17"
time = "0.3.44"
rasn = "0.28.1"
rasn-cms = "0.28.1"
rasn-pkix = "0.28.1"
num-traits = "0.2.19"
chrono = "0.4.42"
rustls-native-certs = "0.8"
rustls-webpki = { version = "0.103", features = ["std", "ring"] }

humantime-serde = "1.1"
glob = "0.3"

[lib]
name = "remonce"
path = "src/lib.rs"

[[bin]]
name = "remonce"
path = "src/main.rs"

[[bin]]
name = "generate-golden"
path = "cmd/generate_golden.rs"

[dev-dependencies]
rcgen = "0.14.6"
