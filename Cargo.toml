[package]
name = "remonse"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
base64 = "0.22"
x509-parser = "0.15"

# Web server framework
axum = { version = "0.8.7", features = ["ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "fs", "trace"] }
tower-sessions = "0.14.0"

# OIDC and Crypto
url = "2.5"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa-core", "pem"] }
rsa = { version = "0.9", features = ["sha2"] }
spki = "0.7"
ecdsa = { version = "0.16", features = ["signing", "verifying"] }
chacha20poly1305 = "0.10"
jsonwebtoken = { version = "9.3", features = ["use_pem"] }
rand = "0.8.5"
hex = "0.4"
toml = "0.9.8"

tracing-subscriber = { version = "0.3.22", features = ["json"] }
hostname = "0.4"
tracing = "0.1.41"
thiserror = "2.0.17"
time = "0.3.44"
rasn = "0.28.1"
rasn-cms = "0.28.1"
rasn-pkix = "0.28.1"
num-traits = "0.2.19"
chrono = "0.4.42"
rustls-native-certs = "0.8"
webpki = { version = "0.22", features = ["std"] }
humantime-serde = "1.1"

[lib]
name = "remonse"
path = "src/lib.rs"

[[bin]]
name = "remonse"
path = "src/main.rs"

[[bin]]
name = "generate-golden"
path = "cmd/generate_golden.rs"
