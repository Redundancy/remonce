name: Release

# Push a tag matching the version in Cargo.toml to publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
# Versions stay below 1.0 while remonce is a proof of concept, and every
# release is marked as a pre-release.
on:
  push:
    tags: ["v0.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Tag matches Cargo.toml, and is below 1.0
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag v$tag doesn't match Cargo.toml version $crate"
            exit 1
          fi
          case "$tag" in
            0.*) ;;
            *) echo "::error::Releases stay below 1.0 for now (got $tag)"; exit 1 ;;
          esac
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binary: runs on any x86_64 Linux, whatever its C library.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --bin remonce --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: scripts/package.sh "${{ needs.version.outputs.version }}" "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          > **A proof-of-concept demonstrator.** remonce hasn't been hardened, refactored through close code review, or security audited. Use it at your own risk.

          | Platform | Download |
          |---|---|
          | Linux x86_64 (static) | \`remonce-v${VERSION}-x86_64-unknown-linux-musl.tar.gz\` |
          | Windows x86_64 | \`remonce-v${VERSION}-x86_64-pc-windows-msvc.zip\` |

          Unpack it and follow GETTING_STARTED.md inside, running \`remonce\` wherever it says \`cargo run --\`. Each archive has a \`.sha256\` checksum beside it.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "remonce v${VERSION}" \
            --notes-file notes.md \
            --prerelease \
            --verify-tag
