<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Remonce</title>
<link rel="stylesheet" href="/static/remonce.css?v=2">
</head>
<body data-page="{{page}}" data-agent-url="{{agent_url}}">
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="/ui">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="6.1" y="6.1" width="19.8" height="19.8" rx="4.5" transform="rotate(45 16 16)" fill="oklch(0.80 0.12 72)" stroke="oklch(0.52 0.10 50)" stroke-width="1.3"/>
        <path d="M16 4.5V27.5M4.5 16H27.5" stroke="oklch(0.52 0.10 50)" stroke-width="1" stroke-linecap="round" opacity=".55"/>
        <circle cx="16" cy="16" r="6" fill="oklch(0.88 0.17 150)" stroke="oklch(0.60 0.15 150)" stroke-width="1"/>
        <circle cx="14.2" cy="14.2" r="1.6" fill="oklch(0.97 0.06 150)"/>
      </svg>
      <span class="brand-wordmark">remonce<span class="dot">.</span></span>
    </a>

    <nav class="nav">
      <div class="nav-section-label">Sign</div>
      <a class="nav-item" data-nav="commands" href="/ui">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2v3a2 2 0 1 1-2 2H2M11 2v3a2 2 0 1 0 2 2h1M5 14v-3a2 2 0 1 0-2-2H2M11 14v-3a2 2 0 1 1 2-2h1M5 5h6v6H5z"/></svg>
        <span>Commands</span>
      </a>
      <a class="nav-item" data-nav="review" href="/ui/review">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9c0-2.2 1.8-4 4-4s4 1.8 4 4v2M6 10v2M8 7v5M10 10v2M4 6c1-1.5 2.5-2.5 4-2.5s3 1 4 2.5"/></svg>
        <span>Sign a request</span>
      </a>
      <a class="nav-item" data-nav="execute" href="/ui/execute">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5v11l9-5.5-9-5.5z" fill="currentColor"/></svg>
        <span>Execute</span>
      </a>
      <div class="nav-section-label">Observe</div>
      <a class="nav-item" data-nav="monitor" href="/ui/monitor">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3.5h10M3 6.5h10M3 9.5h7M3 12.5h10"/></svg>
        <span>Runs</span>
      </a>
      <a class="nav-item" data-nav="files" href="/ui/files">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6L9 2z"/><path d="M9 2v4h4"/></svg>
        <span>Files</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="avatar">{{initials}}</div>
        <div class="user-info">
          <span class="name">{{username}}</span>
          <span class="sub">signer on {{hostname}}</span>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumbs">
        <span>Remonce</span>
        <span class="sep">/</span>
        <span class="here">{{title}}</span>
      </div>
      <div class="agent-field" title="The agent this page executes on, streams from and revokes on">
        <label for="agent-url">Agent</label>
        <input id="agent-url" list="agent-urls" spellcheck="false" autocomplete="off">
        <datalist id="agent-urls">{{agent_options}}</datalist>
      </div>
    </header>

    <main class="content">
{{content}}
    </main>
  </div>
</div>
<script src="/static/app.js?v=2"></script>
</body>
</html>
