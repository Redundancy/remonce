<div class="page-head">
  <div>
    <h1>Execute</h1>
    <div class="sub">Run a signed approval on the agent, or revoke it so no agent will accept it.</div>
  </div>
</div>

<div id="exec-result"></div>

<section id="exec-input" class="panel drop-zone">
  <div class="field">
    <label for="exec-token">Signed approval</label>
    <textarea id="exec-token" class="input" spellcheck="false" placeholder="Drop the signed .json file here, or paste its token"></textarea>
  </div>
  <div class="actions">
    <button id="exec-file" type="button" class="btn">Open file…</button>
    <input id="exec-file-input" type="file" accept=".json,.txt,application/json,text/plain" hidden>
    <span class="hint-line">Files are read here in your browser, not uploaded.</span>
    <span class="spacer"></span>
    <button id="exec-btn" type="button" class="btn">Review</button>
  </div>
</section>

<div id="exec-detail" hidden></div>
