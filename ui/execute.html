<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remonse - Execute</title>
    <link rel="stylesheet" href="/ui/bootstrap.min.css">
    <link rel="stylesheet" href="/ui/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg border-bottom mb-4" style="background-color: #1e1f22;">
        <div class="container">
            <a class="navbar-brand text-light" href="/ui/commands">Remonse @ {{hostname}}</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/generate">Generate</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/inspect">Inspect & Sign</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/ui/execute">Execute</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/monitor">Monitor</a>
                    </li>
                </ul>
                <div class="navbar-text text-secondary small">
                    {{subject}}
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Execute Command</h2>

        <!-- Input Section -->
        <div id="execution-input-area" class="row justify-content-center mb-4">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-danger">
                    <div class="card-body">
                        <p class="text-muted small">Paste a signed token from yourself or another user to execute it.
                        </p>
                        <div class="mb-3">
                            <label for="signed-token-input" class="form-label">Signed Token</label>
                            <textarea id="signed-token-input" class="form-control" rows="3"
                                placeholder="Paste Base64 signed token here..."></textarea>
                        </div>
                        <button id="execute-token-btn" class="btn btn-danger w-100">
                            Execute
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Monitoring Section -->
        <footer class="mt-5 mb-3 text-center text-muted small">
            Built with love ❤️, and AI 🤖
        </footer>

        <script src="/ui/bootstrap.bundle.min.js"></script>
        <script src="/ui/signing.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                // Auto-execute if signed_token is present is handled in signing.js
            });
        </script>
</body>

</html>
