<div class="page-head">
  <div>
    <h1>Execute</h1>
    <div class="sub">Run a signed approval on the agent, or revoke it so no agent will accept it.</div>
  </div>
</div>

<div id="exec-result"></div>

<section class="panel">
  <div class="field">
    <label for="exec-token">Signed approval</label>
    <textarea id="exec-token" class="input" spellcheck="false" placeholder="Paste the signed token (base64) or JSON bundle"></textarea>
  </div>
  <div class="actions">
    <button id="exec-btn" class="btn">Review</button>
  </div>
</section>

<div id="exec-detail" hidden></div>
