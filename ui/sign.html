<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Secure Signing</h4>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label text-muted small">ID Token Subject</label>
                    <div class="form-control-plaintext text-white pb-0 pt-0">{{subject}}</div>
                </div>

                <div class="mb-4">
                    <label for="command-input" class="form-label">Command Name</label>
                    <input type="text" class="form-control" id="command-input" placeholder="e.g. test">
                </div>

                <button id="sign-btn" class="btn btn-primary w-100 mb-3">
                    Sign & Execute
                </button>

                <!-- Hidden fields for signing logic -->
                <div id="result-area" style="display:none;" class="mt-3">
                    <label class="form-label small text-muted">Signature Generated</label>
                    <div id="signature-output" class="small text-break"></div>
                </div>

                <div id="agent-result-area" style="display:none;" class="mt-3">
                    <div id="agent-output"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Check URL param
        const urlParams = new URLSearchParams(window.location.search);
        const cmd = urlParams.get('cmd');
        if (cmd) {
            document.getElementById('command-input').value = cmd;
        }
    });
</script>
