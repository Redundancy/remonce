<h2 class="mb-4">Execution Monitor</h2>

<!-- Input Section (only shown if no ID provided) -->
<div id="monitor-input-area" class="row justify-content-center mb-4">
    <div class="col-md-8 col-lg-6">
        <div class="input-group">
            <input type="text" id="execution-id-input" class="form-control" placeholder="Enter Execution ID (UUID)">
            <button class="btn btn-primary" type="button" id="start-monitor-btn">Monitor</button>
        </div>
        <div class="form-text">Enter the ID of a running or completed command to view its logs.</div>
        <div id="agent-url-area" class="mt-3"></div>
    </div>
</div>

<!-- Monitoring Section -->
<div id="agent-result-area" class="alert alert-dark p-0 overflow-hidden"
    style="display:none; border: 1px solid #30363d;">
    <div class="bg-dark p-2 border-bottom border-secondary d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <span id="status-area" class="fw-bold text-light">Status: Connecting...</span>
            <span class="spinner-border spinner-border-sm text-primary" role="status" id="loading-spinner"
                style="display:none;"></span>
        </div>
        <div id="tail-controls" style="display:none;">
            <button class="btn btn-xs btn-outline-info" onclick="reloadStream(1000)">Tail 1000</button>
            <button class="btn btn-xs btn-outline-warning" onclick="reloadStream(-1)">Load All</button>
        </div>
    </div>
    <div id="agent-output" style="height: 500px; overflow-y: auto; scroll-behavior: smooth;"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        initMonitorPage();
    });
</script>
