<section id="monitor-open" hidden>
  <div class="page-head">
    <div>
      <h1>Runs</h1>
      <div class="sub">Follow an execution's output by its execution ID. Runs you start from this signer open here automatically.</div>
    </div>
  </div>
  <section class="panel">
    <div class="field">
      <label for="monitor-id">Execution ID</label>
      <input id="monitor-id" class="input" spellcheck="false" autocomplete="off" placeholder="e.g. 63d58cb8-66d7-477f-a61f-b72c55deaddc">
    </div>
    <div class="actions">
      <button id="monitor-go" class="btn btn-primary">Open</button>
    </div>
  </section>
</section>

<section id="monitor-view" hidden>
  <div class="page-head">
    <div>
      <h1><span id="run-title"></span></h1>
      <div class="sub"><span id="run-state" class="live-pill" data-state="connecting"><span class="live-dot"></span><span>connecting</span></span></div>
    </div>
  </div>

  <div id="run-facts" class="run-facts"></div>

  <div class="term">
    <div class="term-chrome">
      <div class="term-title">
        <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h10a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 13 13H3a1.5 1.5 0 0 1-1.5-1.5v-7A1.5 1.5 0 0 1 3 3zM4 6.5 6 8 4 9.5M8 10h3"/></svg>
        <span id="term-title" class="mono"></span>
      </div>
      <div class="term-tools">
        <div class="seg" id="term-range" hidden>
          <button type="button" data-tail="1000">last 1000</button>
          <button type="button" data-tail="-1">whole file</button>
        </div>
        <div class="search-box">
          <input id="term-filter" placeholder="filter lines…" spellcheck="false" autocomplete="off">
        </div>
        <button id="term-wrap" type="button" class="tool-toggle on" title="Wrap long lines">wrap</button>
        <button id="term-follow" type="button" class="tool-toggle on" title="Show new lines as they arrive. Off pauses the view; new lines are held until you turn it back on">follow</button>
        <button id="term-copy" type="button" class="tool-toggle" title="Copy the log">copy</button>
        <button id="term-download" type="button" class="tool-toggle" title="Download the log">download</button>
      </div>
    </div>
    <div id="term-out" class="term-out wrap"></div>
    <div class="term-foot"><span id="term-count">0 of 0 lines</span></div>
  </div>
</section>
