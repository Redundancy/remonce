<div class="page-head">
  <div>
    <h1><span class="accent-em">Sign</span> a request</h1>
    <div class="sub">Review a request someone prepared for you, or a delegated approval waiting for your co-signature. Nothing is signed until you press Sign and log in again.</div>
  </div>
</div>

<div id="review-result"></div>

<section id="review-input" class="panel drop-zone">
  <div class="field">
    <label for="review-token">Request or approval</label>
    <textarea id="review-token" class="input" spellcheck="false" placeholder="Drop the .json file you were sent here, or paste its token"></textarea>
  </div>
  <div class="actions">
    <button id="review-file" type="button" class="btn">Open file…</button>
    <input id="review-file-input" type="file" accept=".json,.txt,application/json,text/plain" hidden>
    <span class="hint-line">Files are read here in your browser, not uploaded.</span>
    <span class="spacer"></span>
    <button id="review-btn" type="button" class="btn">Review</button>
  </div>
</section>

<div id="review-detail" hidden></div>
