<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remonce Profile</title>
    <link rel="stylesheet" href="/ui/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Remonce Secure Profile</h1>
        </header>

        <div class="user-info">
            <div class="info-group">
                <span class="label">User Subject</span>
                <div class="value">{{subject}}</div>
            </div>

            <div class="info-group">
                <span class="label">ID Token</span>
                <div class="value">{{id_token}}</div>
            </div>

            <div class="info-group">
                <span class="label">Ephemeral Public Key (PEM)</span>
                <div class="value" style="white-space: pre-wrap;">{{public_key}}</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-link active" data-tab="Sign">Sign & Execute</button>
            <button class="tab-link" data-tab="Read">Available Commands</button>
        </div>

        <div id="Sign" class="tab-content" style="display: block;">
            <div class="signing-section">
                <h2>Secure Signing</h2>
                <label class="label" for="command-input">Command Name</label>
                <input type="text" id="command-input" value="test" placeholder="Enter command name (e.g., test)">
                <button id="sign-btn">Sign Payload</button>

                <div id="result-area">
                    <span class="label">Signature (Hex):</span>
                    <div id="signature-output" class="value"></div>
                </div>

                <div id="agent-result-area" style="display:none; margin-top: 20px;">
                    <span class="label">Agent Execution Result:</span>
                    <pre id="agent-output"
                        style="background: rgba(0,0,0,0.1); padding: 10px; border-radius: 4px; overflow-x: auto;"></pre>
                </div>
            </div>
        </div>

        <div id="Read" class="tab-content" style="display: none;">
            <h2>Available Commands</h2>
            <div id="commands-list">Loading...</div>
        </div>

        <script src="/ui/signing.js"></script>
    </div>
</body>

</html>
